<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Setter</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for a Cohesive, Dark Theme */
        :root {
            --primary-color: #7B68EE; /* Medium Purple - A cool, eye-catching accent */
            --secondary-color: #4A4A6A; /* Darker Purple-Gray for subtle contrast */
            --background-color: #2D2D3A; /* Deep Dark Gray-Purple Background */
            --surface-color: #3B3B4D;   /* Slightly lighter surface for cards/inputs */
            --text-color: #E0E0E0; /* Light Gray for main text */
            --light-text-color: #A0A0A0; /* Lighter gray for secondary text/placeholders */
            --subtle-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); /* Deeper shadow for dark theme */
            --border-radius: 12px;
            --success-color: #4CAF50; /* Green for success messages */
            --error-color: #F44336;   /* Red for error messages */
        }

        /* General Body Styling - Dark, Sleek, and Modern */
        body {
            font-family: 'Poppins', sans-serif;
            width: 300px; /* Slightly wider for better spacing */
            padding: 20px;
            background-color: var(--background-color);
            color: var(--text-color);
            border-radius: var(--border-radius);
            box-shadow: var(--subtle-shadow);
            transition: all 0.3s ease;
        }
       
        h2 { 
            text-align: center; 
            margin-bottom: 15px; 
            color: var(--primary-color); /* Highlight with primary color */
            font-weight: 700;
        }
        
        /* Current URL Display and Status Area */
        #currentUrl {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px 12px;
            background-color: var(--surface-color); /* Use surface color for a card effect */
            border-radius: 8px;
            font-size: 0.9em;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-weight: 600;
            color: var(--text-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); /* Soft internal shadow */
            transition: background-color 0.3s, color 0.3s;
        }

        /* Input and button styling - Unified look */
        input, button {
            padding: 10px 12px;
            border: 1px solid var(--secondary-color); /* Subtle border for inputs */
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.2s ease;
            color: var(--text-color);
            background-color: var(--surface-color); /* Match surface color */
        }
        
        /* Placeholder text color */
        input::placeholder {
            color: var(--light-text-color);
            opacity: 0.8;
        }

        /* Zoom Control Group */
        .zoom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        /* Zoom Input specific styling */
        input#zoomLevel { 
            flex-grow: 1;
            max-width: 100px; 
            text-align: center; 
            font-weight: 600;
            color: var(--primary-color); /* Highlight zoom value */
        }
        input#zoomLevel:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(123, 104, 238, 0.3); /* Softer focus glow */
            outline: none;
        }

        /* Save Button Styling - Primary Action */
        button#saveZoom { 
            flex-grow: 2;
            cursor: pointer;
            background-color: var(--primary-color); 
            color: white; /* White text on vibrant button */
            border: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        button#saveZoom:hover { 
            background-color: #6A5ACD; /* Slightly darker purple on hover */
            transform: translateY(-2px); /* More pronounced lift */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        button#saveZoom:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        /* Saved Sites Header */
        h3 { 
            margin-top: 25px; /* More space above header */
            margin-bottom: 10px; 
            color: var(--text-color);
            font-size: 1.1em;
            font-weight: 600;
            border-bottom: 2px solid var(--secondary-color); /* Subtle separator */
            padding-bottom: 5px;
        }
        
        /* List of saved zoom sites container */
        ul { 
            list-style: none; 
            padding: 0; 
            max-height: 150px; /* Limit height and allow scrolling */
            overflow-y: auto;
            margin-bottom: 10px; /* Space below list */
        }
        /* Scrollbar for dark theme */
        ul::-webkit-scrollbar {
            width: 8px;
        }
        ul::-webkit-scrollbar-track {
            background: var(--surface-color);
            border-radius: 10px;
        }
        ul::-webkit-scrollbar-thumb {
            background-color: var(--secondary-color);
            border-radius: 10px;
            border: 2px solid var(--surface-color);
        }

        /* Individual List Item Styling - Card-like appearance */
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--surface-color); /* Match surface color for cards */
            border-radius: 8px;
            margin: 8px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); /* Soft shadow */
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s, opacity 0.3s;
        }
        li:hover {
            background-color: #4A4A6A; /* Slightly lighter on hover */
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        /* List item text */
        li span {
            font-size: 0.95em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }

        /* Remove Button Styling - Clear and simple */
        .remove-btn {
            background: none;
            border: none;
            color: var(--error-color); /* Red for danger action */
            cursor: pointer;
            font-size: 1.1em;
            padding: 4px;
            margin-left: 10px;
            transition: color 0.2s, transform 0.1s;
        }
        .remove-btn:hover {
            color: #E57373; /* Lighter red on hover */
            transform: scale(1.1);
        }

        /* Empty list message styling */
        .empty-list-message {
            text-align: center;
            font-size: 0.9em;
            color: var(--light-text-color);
            padding: 15px 0;
        }

    </style>
</head>
<body>
    <div class="popup-container">
        <h2>🌐 Zoom Setter</h2>
        
        <p id="currentUrl">Loading Site...</p>

        <div class="zoom-controls">
            <input type="number" id="zoomLevel" placeholder="Zoom %" min="50" max="200" title="Enter zoom level (50-200)">
            <button id="saveZoom">✨ Save Zoom</button>
        </div>

        <h3>Saved Sites:</h3>
        <ul id="siteList"></ul>
    </div>

    <script src="popup.js"></script>
</body>
</html>
